---
definition_version: 1
uid: pe-snapshot
title: Snapshots
description: Hypervisor snapshots taken by pe_snapshot, as each proxy last listed them.
variables: [pe]
panels:
  - title: Active Snapshots
    type: stat
    width: 6
    unit: short
    description: Managed snapshots that have not reached their expiry.
    targets:
      - expr: 'sum(pe_snapshot_snapshots{state="active", alias=~"$pe"}) or vector(0)'
    thresholds:
      - colour: neutral
  - title: Expired, Awaiting Sweep
    type: stat
    width: 6
    unit: short
    description: Past expiry and still present. Normal for up to one agent interval on the proxy.
    targets:
      - expr: 'sum(pe_snapshot_snapshots{state="expired", alias=~"$pe"}) or vector(0)'
    thresholds:
      - colour: good
      - colour: warning
        value: 1
  - title: Endpoints In Error
    type: stat
    width: 6
    unit: short
    targets:
      - expr: 'sum(pe_snapshot_endpoints{status="error", alias=~"$pe"}) or vector(0)'
    thresholds:
      - colour: good
      - colour: critical
        value: 1
  - title: Unmapped Nodes
    type: stat
    width: 6
    unit: short
    description: Nodes with the pe_snapshot class that the plans can't reach, because provider, proxy, endpoint or vm_id is missing.
    targets:
      - expr: 'sum(pe_snapshot_nodes{mapping="unmapped", alias=~"$pe"}) or vector(0)'
    thresholds:
      - colour: neutral
  - title: Snapshots Over Time
    type: timeseries
    width: 16
    unit: short
    targets:
      - expr: 'sum by (state) (pe_snapshot_snapshots{alias=~"$pe"})'
        legend: '{{state}}'
  - title: Snapshots By Age
    type: bargauge
    width: 8
    unit: short
    targets:
      - expr: 'sum by (age_bucket) (pe_snapshot_snapshots{alias=~"$pe"})'
        legend: '{{age_bucket}}'
        instant: true
    thresholds:
      - colour: neutral
  - title: Endpoints
    type: table
    width: 12
    targets:
      - expr: 'sum by (endpoint, status) (pe_snapshot_endpoints{alias=~"$pe"})'
        instant: true
        format: table
  - title: Nodes By Provider
    type: table
    width: 12
    targets:
      - expr: 'sum by (provider, mapping) (pe_snapshot_nodes{alias=~"$pe"})'
        instant: true
        format: table
