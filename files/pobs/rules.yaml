---
pe_snapshot:
  # The proxy fact is gathered before the run that sweeps, so PuppetDB shows an
  # expired snapshot for up to one agent interval after it's gone. 75 minutes
  # is two and a half 30-minute intervals.
  PeSnapshotExpiredNotSwept:
    expr: 'sum by (alias, endpoint) (pe_snapshot_snapshots{state="expired"}) > 0'
    for: 75m
    labels:
      severity: warning
    annotations:
      summary: 'Expired snapshots on {{ $labels.endpoint }} are not being deleted'
      description: |-
        Snapshots past their expiry are still on endpoint {{ $labels.endpoint }}, more than one agent run after they should have been deleted. Each one holds disk on the hypervisor until it goes.
        Check the proxy's last agent run for Exec[pe_snapshot sweep {{ $labels.endpoint }}]. Each line names a snapshot and either "deleted" or the pe_snapshot error that stopped it.
        If there is no sweep exec, the proxy has not run Puppet, pe_snapshot::proxy::sweep is false, or the endpoint is in error (see PeSnapshotEndpointUnreachable).
        If the endpoint was removed from the proxy's Hiera, nothing sweeps it any more: delete its snapshots with pe_snapshot::delete or on the hypervisor.
        Error kinds are explained in the module's docs/troubleshooting.md.
  PeSnapshotEndpointUnreachable:
    expr: 'sum by (alias, endpoint) (pe_snapshot_endpoints{status="error"}) > 0'
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: 'A proxy cannot list snapshots on {{ $labels.endpoint }}'
      description: |-
        The proxy for endpoint {{ $labels.endpoint }} could not list snapshots on its last agent run. Expired snapshots there are not being swept, and plans using the endpoint will fail.
        On the proxy, run `sudo puppet facts show pe_snapshot_proxy` and read endpoints[].error for this endpoint. It never contains a credential.
        api_unreachable is network or TLS from the proxy to the API. api_error with HTTP 401 or 403 is the credential: revoked, expired, or missing a privilege. A GCE 400 with invalid_grant is an expired authorized_user login. missing_credentials or unreadable_credentials is the proxy's credentials file.
        Fix it and run the agent on the proxy. The alert clears when the fact next reaches PuppetDB.
  PeSnapshotOlderThanAWeek:
    expr: 'sum by (alias, endpoint) (pe_snapshot_snapshots{age_bucket="gt_7d"}) > 0'
    for: 1h
    labels:
      severity: info
    annotations:
      summary: 'Snapshots older than a week on {{ $labels.endpoint }}'
      description: |-
        Managed snapshots on {{ $labels.endpoint }} are more than seven days old. That only happens with allow_no_expiry or a max_retention_hours above 168 on the proxy.
        Long-lived snapshots cost disk and, on most hypervisors, slow the VM's disk I/O as the delta grows.
        Find them in the Snapshots board's Snapshots By Node table, or with pe_snapshot::list. Delete any that are no longer wanted with pe_snapshot::delete by tag.
